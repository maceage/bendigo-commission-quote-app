# Serves the built front end and proxies /api to quote-service, so the
# browser sees one origin (no CORS) and never learns the backends exist.

server {
    listen 80;
    server_tokens off;

    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://quote-service:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # quote-service gives up on the vendor after 8s and the browser
        # after 15s; wait longer than both so neither is cut off here.
        proxy_read_timeout 20s;
    }

    # Vite fingerprints asset filenames, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Anything else is the single-page app.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }
}
