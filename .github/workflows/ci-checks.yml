name: Run Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  RunChecks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # The full test suite, failing if any package's src/ coverage drops below 90%.
      - run: npm run test:coverage
      - run: npm run build

  DockerSmokeTest:
    runs-on: ubuntu-latest
    env:
      VENDOR_API_KEY: ci-only-key
    steps:
      - uses: actions/checkout@v7
      # Builds and starts the stack, checks it through nginx, and shuts it
      # down (printing container logs on failure). Same script runs locally.
      - name: Smoke-test the Docker stack
        run: bash docker/smoke-test.sh
